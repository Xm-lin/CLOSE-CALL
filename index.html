<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10131a"><title>CLOSE CALL — 擦邊球</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10131a;color:#f4f5f7;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}.hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;display:flex;justify-content:space-between;align-items:start;padding:18px 20px;pointer-events:none}.metric{font-size:10px;letter-spacing:2px;color:#9aa4b6}.num{font-size:25px;font-weight:800;font-variant-numeric:tabular-nums}.right{text-align:right}.center{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none}.panel{pointer-events:auto;width:min(90vw,390px);text-align:center;padding:28px 23px;border:1px solid #343b4a;border-radius:22px;background:#171c27ee;box-shadow:0 18px 80px #0007;backdrop-filter:blur(14px)}h1{font-size:40px;letter-spacing:-2px;margin:0 0 4px}h2{font-size:30px;margin:0 0 8px}.sub{color:#a5afbf;font-size:13px;line-height:1.8}.button{border:0;border-radius:12px;background:#f7d46a;color:#171b23;font-weight:850;font-size:16px;padding:15px 24px;width:100%;margin-top:19px;cursor:pointer}.secondary{background:#30394a;color:#f3f4f6;margin-top:9px}.hide{display:none!important}.pill{display:inline-block;color:#f7d46a;background:#f7d46a1a;padding:5px 10px;border-radius:20px;font-size:11px;letter-spacing:2px;margin-bottom:14px}.small{font-size:11px;color:#8e99ab;margin-top:13px}.toast{position:fixed;top:90px;left:50%;transform:translateX(-50%);font-size:20px;font-weight:900;color:#f7d46a;text-shadow:0 3px 14px #000;pointer-events:none;opacity:0;transition:opacity .18s;white-space:nowrap}.toast.show{opacity:1}.footer{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#697487;font-size:11px;pointer-events:none}</style></head><body><canvas id="game"></canvas><div class="hud"><div><div class="metric">SCORE</div><div class="num" id="score">0</div><div class="metric" id="combo">COMBO ×0</div></div><div class="right"><div class="metric">BEST</div><div class="num" id="best">0</div><div class="metric" id="mode">FREE RUN</div></div></div><div class="toast" id="toast"></div><div class="center" id="overlay"><div class="panel" id="panel"><div class="pill">ONE TAP · ENDLESS</div><h1>CLOSE CALL</h1><div style="font-size:21px;font-weight:800;margin-bottom:12px">擦邊球</div><div class="sub">小球會自動前進，<b>點一下切換左右方向</b>。<br>閃過障礙就得分，貼得越近分數越高。<br>撞到障礙或邊界就結束。</div><button class="button" id="start">開始挑戰</button><button class="button secondary" id="daily">每日同圖挑戰</button><div class="small">手機點擊 / 電腦滑鼠或空白鍵 · 可按 P 暫停</div></div></div><div class="footer" id="footer">TAP TO SWITCH DIRECTION</div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),comboEl=document.getElementById('combo'),modeEl=document.getElementById('mode'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),toast=document.getElementById('toast'),footer=document.getElementById('footer');let W=0,H=0,dpr=1,run=false,paused=false,dead=false,last=0,elapsed=0,distance=0,score=0,combo=0,best=0,ball,obstacles=[],particles=[],spawnAt=0,seed=1,rng=Math.random,mode='free',flash=0,shake=0,toastTimer=0,passed=0;const today=()=>new Date().toLocaleDateString('en-CA');function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}function seeded(n){return ()=>{n+=0x6D2B79F5;let t=n;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}}function random(a,b){return a+(b-a)*rng()}function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(ball){ball.x=Math.max(15,Math.min(W-15,ball.x))}}addEventListener('resize',resize);resize();function storageKey(){return 'closecall-best-'+mode}function loadBest(){try{return +(localStorage.getItem(storageKey())||0)}catch{return 0}}function saveBest(){try{localStorage.setItem(storageKey(),String(best))}catch{}}function init(type){mode=type;modeEl.textContent=mode==='daily'?'DAILY '+today():'FREE RUN';rng=mode==='daily'?seeded(hash('closecall-v1-'+today())):Math.random;best=loadBest();bestEl.textContent=best;elapsed=distance=score=combo=passed=spawnAt=flash=shake=0;obstacles=[];particles=[];ball={x:W/2,y:H*.73,r:10,dir:1,trail:[]};run=true;paused=false;dead=false;overlay.classList.add('hide');footer.textContent='TAP TO SWITCH DIRECTION';scoreEl.textContent='0';comboEl.textContent='COMBO ×0';for(let i=0;i<7;i++)spawn(H*.1-i*125);last=performance.now()}function spawn(y){const diff=Math.min(1,passed/75),kind=passed<6?'circle':rng()<.18+diff*.19?'bar':rng()<.23+diff*.18?'moving':'circle',r=random(18,30+diff*16),margin=32;let x=random(margin+r,Math.max(margin+r+1,W-margin-r));if(W<270)x=random(r+16,W-r-16);const color=['#f07e90','#a58bf5','#6cd4bb','#f0b96b','#79a9ee'][Math.floor(random(0,5))];const obj={kind,x,y,r,color,phase:random(0,Math.PI*2),amp:random(18,Math.min(55,W*.16)),speed:random(.8,1.8),angle:random(0,Math.PI),rot:random(-1.4,1.4),length:random(55,105),width:random(12,18),passed:false,closest:999};if(kind==='bar')obj.x=Math.max(70,Math.min(W-70,obj.x));obstacles.push(obj)}function tip(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),560)}function sound(freq=480,dur=.07){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const a=window._closeAudio||(window._closeAudio=new AC());if(a.state==='suspended')a.resume();const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(freq,a.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.7,a.currentTime+dur);g.gain.setValueAtTime(.065,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur)}catch{}}function tap(){if(!run||paused||dead)return;ball.dir*=-1;sound(330,.045);for(let i=0;i<5;i++)particles.push({x:ball.x,y:ball.y,vx:random(-75,75),vy:random(-70,70),life:.3,max:.3,color:'#f7d46a'})}function pointSegment(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy)));return Math.hypot(px-(x1+t*dx),py-(y1+t*dy))}function distTo(o){if(o.kind==='bar'){const dx=Math.cos(o.angle)*o.length/2,dy=Math.sin(o.angle)*o.length/2;return pointSegment(ball.x,ball.y,o.x-dx,o.y-dy,o.x+dx,o.y+dy)-o.width/2-ball.r}return Math.hypot(ball.x-o.x,ball.y-o.y)-o.r-ball.r}function reward(o){const d=o.closest;let extra=0,label='';if(d<8){extra=100;label='PERFECT +100'}else if(d<19){extra=50;label='CLOSE +50'}else if(d<35){extra=20;label='NEAR +20'}score+=10+extra;if(extra){combo++;score+=Math.min(combo,20)*5;tip(label+'  ×'+combo);sound(520+Math.min(combo,15)*35,.11);flash=.15;for(let i=0;i<15;i++)particles.push({x:o.x,y:ball.y,vx:random(-130,130),vy:random(-130,130),life:random(.2,.6),max:.6,color:o.color})}else combo=0;scoreEl.textContent=score.toLocaleString();comboEl.textContent='COMBO ×'+combo;if(score>best){best=score;bestEl.textContent=best.toLocaleString();saveBest()}}function gameOver(){dead=true;run=false;shake=12;sound(155,.23);footer.textContent='';panel.innerHTML='<div class="pill">GAME OVER</div><h2>差一點！</h2><div class="sub">本局得分</div><div style="font-size:52px;font-weight:900;color:#f7d46a">'+score.toLocaleString()+'</div><div class="sub">最高紀錄 '+best.toLocaleString()+' · 通過 '+passed+' 個障礙</div><button class="button" id="again">再玩一次</button><button class="button secondary" id="share">分享成績</button><button class="button secondary" id="menu">返回主選單</button>';overlay.classList.remove('hide');document.getElementById('again').onclick=()=>init(mode);document.getElementById('share').onclick=share;document.getElementById('menu').onclick=menu}function share(){const msg='我在《擦邊球 CLOSE CALL》'+(mode==='daily'?today()+' 每日挑戰 ':'')+'拿到 '+score+' 分！你能超越嗎？\n'+location.href.split('?')[0]+(mode==='daily'?'?daily=1':'');if(navigator.share)navigator.share({title:'CLOSE CALL',text:msg}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(msg).then(()=>tip('已複製挑戰文字')).catch(()=>prompt('複製成績',msg));else prompt('複製成績',msg)}function menu(){run=false;dead=false;panel.innerHTML='<div class="pill">ONE TAP · ENDLESS</div><h1>CLOSE CALL</h1><div style="font-size:21px;font-weight:800;margin-bottom:12px">擦邊球</div><div class="sub">小球會自動前進，<b>點一下切換左右方向</b>。<br>閃過障礙就得分，貼得越近分數越高。<br>撞到障礙或邊界就結束。</div><button class="button" id="start">開始挑戰</button><button class="button secondary" id="daily">每日同圖挑戰</button><div class="small">手機點擊 / 電腦滑鼠或空白鍵 · 可按 P 暫停</div>';document.getElementById('start').onclick=()=>init('free');document.getElementById('daily').onclick=()=>init('daily');overlay.classList.remove('hide');footer.textContent='TAP TO SWITCH DIRECTION'}function update(dt){if(!run||paused)return;elapsed+=dt;const diff=Math.min(1,passed/85),scroll=175+diff*120,side=Math.min(205,W*.48)+diff*35;distance+=scroll*dt;ball.x+=ball.dir*side*dt;ball.trail.push({x:ball.x,y:ball.y});if(ball.trail.length>16)ball.trail.shift();if(ball.x<ball.r||ball.x>W-ball.r){ball.x=Math.max(ball.r,Math.min(W-ball.r,ball.x));gameOver();return}for(const o of obstacles){o.y+=scroll*dt;if(o.kind==='moving')o.x+=Math.cos(elapsed*o.speed+o.phase)*o.amp*dt*1.8;if(o.kind==='bar')o.angle+=o.rot*dt;const d=distTo(o);if(Math.abs(o.y-ball.y)<110){o.closest=Math.min(o.closest,d);if(d<0){gameOver();return}}if(!o.passed&&o.y>ball.y+Math.max(o.r,o.length/2||0)+ball.r){o.passed=true;passed++;reward(o)}}obstacles=obstacles.filter(o=>o.y<H+130);let top=obstacles.reduce((m,o)=>Math.min(m,o.y),H);while(top>-140){top-=random(105+diff*18,155+diff*20);spawn(top)}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);flash=Math.max(0,flash-dt);shake=Math.max(0,shake-35*dt)}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#10131a';ctx.fillRect(0,0,W,H);ctx.save();if(shake>0)ctx.translate(random(-shake,shake),random(-shake,shake));ctx.strokeStyle='#202631';ctx.lineWidth=1;const shift=distance%54;for(let x=W/2%54;x<W;x+=54){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=shift-54;y<H;y+=54){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(const o of obstacles){ctx.save();ctx.translate(o.x,o.y);ctx.fillStyle=o.color;ctx.shadowColor=o.color;ctx.shadowBlur=13;if(o.kind==='bar'){ctx.rotate(o.angle);rounded(-o.length/2,-o.width/2,o.length,o.width,o.width/2);ctx.fill()}else{ctx.beginPath();ctx.arc(0,0,o.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffffff1b';ctx.beginPath();ctx.arc(-o.r*.25,-o.r*.25,o.r*.3,0,Math.PI*2);ctx.fill()}ctx.restore()}if(ball){for(let i=0;i<ball.trail.length;i++){const p=ball.trail[i];ctx.fillStyle='rgba(247,212,106,'+(i/ball.trail.length*.3)+')';ctx.beginPath();ctx.arc(p.x,p.y,ball.r*(.3+.6*i/ball.trail.length),0,Math.PI*2);ctx.fill()}ctx.shadowColor='#f7d46a';ctx.shadowBlur=23;ctx.fillStyle='#f7d46a';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff5c5';ctx.beginPath();ctx.arc(ball.x-3,ball.y-3,3,0,Math.PI*2);ctx.fill()}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1;ctx.restore();if(flash>0){ctx.fillStyle='rgba(255,220,120,'+(flash*.3)+')';ctx.fillRect(0,0,W,H)}if(paused){ctx.fillStyle='#0b0e16bb';ctx.fillRect(0,0,W,H);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 28px system-ui';ctx.fillText('PAUSED',W/2,H/2)}}function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function frame(t){const dt=Math.min((t-last)/1000||0,.033);last=t;update(dt);draw();requestAnimationFrame(frame)}canvas.addEventListener('pointerdown',e=>{e.preventDefault();tap()});addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowLeft'||e.code==='ArrowRight'){e.preventDefault();if(!e.repeat)tap()}if(e.code==='KeyP'&&run){paused=!paused;footer.textContent=paused?'按 P 繼續':'TAP TO SWITCH DIRECTION'}});document.getElementById('start').onclick=()=>init('free');document.getElementById('daily').onclick=()=>init('daily');best=loadBest();bestEl.textContent=best;requestAnimationFrame(frame);if(new URLSearchParams(location.search).has('daily'))init('daily')})();
</script></body></html>
