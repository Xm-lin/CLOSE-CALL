<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>手寫符號轉換</title>
    <style>
        :root {
            --bg: #f5f3ee;
            --ink: #222824;
            --line: #c9c9c0
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: Arial, "Noto Sans TC", sans-serif
        }

        header {
            border-bottom: 1px solid var(--line);
            padding: 22px clamp(22px, 6vw, 90px);
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        header b {
            font-size: 19px;
            letter-spacing: -.8px
        }

        header span,
        small {
            font-size: 11px;
            letter-spacing: 1.6px;
            color: #767a73
        }

        main {
            max-width: 1180px;
            margin: auto;
            padding: 70px 28px 90px
        }

        h1 {
            font-family: Georgia, serif;
            font-weight: 400;
            font-size: clamp(43px, 7vw, 88px);
            line-height: 1.08;
            letter-spacing: -3px;
            margin: 0 0 16px
        }

        .sub {
            font-size: 14px;
            color: #777d74;
            margin: 0 0 65px
        }

        .columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 38px
        }

        .label {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #777e75;
            padding-bottom: 12px;
            font-size: 12px;
            letter-spacing: 1.4px;
            text-transform: uppercase
        }

        textarea {
            width: 100%;
            min-height: 260px;
            border: 0;
            outline: 0;
            background: transparent;
            resize: vertical;
            font: 26px/1.6 Georgia, serif;
            color: var(--ink);
            padding: 25px 0
        }

        #preview {
            min-height: 260px;
            padding: 25px 0;
            display: flex;
            align-content: flex-start;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 3px 2px
        }

        .glyph {
            width: 36px;
            height: 54px;
            display: inline-flex;
            align-items: center;
            justify-content: center
        }

        .glyph img {
            max-width: 32px;
            max-height: 43px;
            object-fit: contain
        }

        .punct {
            font: 30px Georgia, serif;
            min-width: 17px;
            text-align: center
        }

        .space {
            width: 20px
        }

        .newline {
            flex-basis: 100%;
            height: 0
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px
        }

        button {
            border: 1px solid #2a302a;
            padding: 14px 21px;
            background: #242c27;
            color: #fff;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 1px
        }

        button.secondary {
            background: transparent;
            color: #242c27
        }

        button:hover {
            opacity: .78
        }

        .guide {
            margin-top: 85px;
            border-top: 1px solid var(--line);
            padding-top: 20px
        }

        .guide h2 {
            font: normal 26px Georgia, serif
        }

        .alphabet {
            display: grid;
            grid-template-columns: repeat(13, 1fr);
            gap: 15px 8px;
            margin-top: 26px
        }

        .letter {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #7c8079
        }

        .letter img {
            width: 35px;
            height: 43px;
            object-fit: contain
        }

        @media(max-width:720px) {
            main {
                padding-top: 44px
            }

            .columns {
                grid-template-columns: 1fr;
                gap: 30px
            }

            .sub {
                margin-bottom: 38px
            }

            .alphabet {
                grid-template-columns: repeat(7, 1fr)
            }

            textarea,
            #preview {
                min-height: 180px
            }

            h1 {
                letter-spacing: -1px
            }
        }
    </style>
</head>

<body>
    <header><b>A—Z</b><span>手寫符號表</span></header>
    <main>
        <h1>喫碼轉換</h1>
        <p class="sub">INPUT</p>
        <div class="columns">
            <section>
                <div class="label"><span>01 / INPUT</span><span>ENGLISH</span></div><textarea id="input"
                    spellcheck="false" placeholder="Type something here...">apple</textarea>
            </section>
            <section>
                <div class="label"><span>02 / OUTPUT</span><span>YOUR SYMBOLS</span></div>
                <div id="preview"></div>
                <div class="actions"><button id="download">下載 PNG ↗</button><button class="secondary"
                        id="copy">複製圖片</button></div>
            </section>
        </div>
        <section class="guide">
            <h2>符號對照表</h2>
            <div class="alphabet" id="alphabet"></div>
        </section>
    </main>
