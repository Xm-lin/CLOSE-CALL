<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#080e1c"><title>CLOSE CALL — 擦邊球</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap');
:root{--gold:#ffe09a;--muted:#879bb5;--edge:#ffffff20}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#080e1c;color:#eef4ff;font-family:'DM Sans','Noto Sans TC',system-ui,sans-serif;touch-action:none;-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}canvas{display:block;width:100%;height:100%}.hidden{display:none!important}
.hud{position:fixed;z-index:2;left:15px;right:15px;top:calc(14px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:start;pointer-events:none}.hud-side{min-width:105px}.eyebrow{color:#9fb1ca;font-size:10px;font-weight:800;letter-spacing:2.1px}.score{font-size:clamp(28px,7vw,40px);font-weight:900;letter-spacing:-1.6px;line-height:1.18;font-variant-numeric:tabular-nums;text-shadow:0 3px 22px #0008}.right{text-align:right}.best{font-size:16px;font-weight:800;letter-spacing:-.5px;margin-top:3px}.combo{font-size:12px;font-weight:900;color:var(--gold);margin-top:5px;letter-spacing:.7px}.mode{font-size:10px;color:#93abc9;margin-top:7px;letter-spacing:1px}.hud-middle{position:absolute;left:50%;top:3px;transform:translateX(-50%);width:min(24vw,110px);text-align:center}.flow-track{margin-top:7px;height:5px;border-radius:5px;background:#ffffff22;overflow:hidden}.flow-fill{height:100%;width:0;background:linear-gradient(90deg,#66dcfa,#ffe09a);border-radius:5px;transition:width .12s}.flow-label{font-size:9px;letter-spacing:2px;font-weight:800;color:#92a9c9}.hud-buttons{position:fixed;right:14px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:4;display:flex;gap:8px}.mini{background:#111d31cf;color:#dce9ff;border:1px solid #ffffff29;border-radius:13px;min-width:43px;height:43px;padding:0 12px;font-weight:800;backdrop-filter:blur(12px)}.hint{position:fixed;left:0;right:0;bottom:calc(31px + env(safe-area-inset-bottom));text-align:center;font-size:10px;letter-spacing:2px;font-weight:800;color:#91a5be;pointer-events:none;z-index:2}
.overlay{position:fixed;inset:0;z-index:6;display:grid;place-items:center;padding:18px;background:linear-gradient(165deg,#060a13b0,#060b17e8);backdrop-filter:blur(12px)}.panel{width:min(100%,420px);max-height:calc(100dvh - 35px);overflow:auto;border:1px solid #ffffff20;border-radius:25px;padding:29px 24px 25px;background:linear-gradient(155deg,#202f47f2,#10192cf5 60%,#0b1425f8);box-shadow:0 28px 95px #0009,inset 0 1px #ffffff18;text-align:center}.tag{display:inline-block;padding:7px 12px;border:1px solid #ffe09a58;border-radius:30px;color:var(--gold);background:#ffe09a12;font-size:10px;font-weight:900;letter-spacing:2px}.logo{width:78px;height:78px;border-radius:50%;margin:20px auto 17px;position:relative;background:radial-gradient(circle at 29% 23%,#fff 0 5%,#fff0 7%),radial-gradient(circle at 35% 28%,#fff8cc,#ffdc87 48%,#d5944c 100%);box-shadow:0 0 0 12px #ffe09a10,0 0 0 24px #ffe09a06,0 0 45px #ffc66a4c}.logo:after{content:'';position:absolute;inset:-12px;border:1px solid #ffe09a4b;border-radius:50%}h1{font-size:clamp(36px,9vw,49px);font-weight:900;letter-spacing:-2.4px;margin:4px 0 7px;line-height:1.08}h2{font-size:32px;font-weight:900;letter-spacing:-1px;margin:13px 0 7px}.kicker{font-size:11px;letter-spacing:4px;font-weight:800;color:#a8bad1}.description{font-size:13px;line-height:1.95;color:#afc0d5;margin:14px 0}.description strong{color:#ffe09a}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:19px 0 15px}.stat{background:#ffffff09;border:1px solid #ffffff12;border-radius:13px;padding:12px 5px}.stat strong{display:block;color:var(--gold);font-size:18px;font-weight:900}.stat span{font-size:10px;color:#9aacc2}.btn{width:100%;border:0;border-radius:14px;background:var(--gold);color:#18243a;font-weight:900;padding:15px 20px;margin-top:11px;box-shadow:0 5px 0 #bd985b;transition:transform .12s}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #bd985b}.btn.alt{background:#ffffff12;color:#e7f1ff;border:1px solid #ffffff22;box-shadow:none}.note{font-size:11px;color:#8298b4;margin-top:18px;line-height:1.6}.result-score{font-size:clamp(54px,15vw,75px);font-weight:900;color:var(--gold);letter-spacing:-2px;line-height:1.1;margin:9px 0}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:19px 0}.result-grid>div{padding:12px 5px;border:1px solid #ffffff18;background:#ffffff08;border-radius:12px}.result-grid strong{display:block;font-size:18px}.result-grid span{font-size:10px;color:#93a6c0}.pause-overlay{background:#060a14a8}.event{position:fixed;top:34%;left:50%;transform:translate(-50%,-50%) scale(.92);pointer-events:none;z-index:3;text-align:center;opacity:0;transition:opacity .12s,transform .16s}.event.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.event strong{display:block;font-size:clamp(23px,7vw,36px);font-weight:900;color:#ffe09a;letter-spacing:1px;text-shadow:0 2px 18px #000b}.event span{display:block;font-size:19px;font-weight:900;color:#a8f7ff;margin-top:3px}.settings{display:flex;justify-content:center;gap:9px;margin-top:12px}.setting{border:1px solid #ffffff20;background:#ffffff09;border-radius:11px;padding:9px 13px;color:#c7d5e8;font-size:11px;font-weight:800}@media(max-height:690px){.panel{padding:18px 22px}.logo{width:46px;height:46px;margin:11px auto}.stats{margin:10px 0}.description{margin:8px 0}.note{margin-top:10px}h1{font-size:34px}.btn{padding:12px}.hud-middle{top:2px}}
</style></head><body>
<canvas id="game" aria-label="CLOSE CALL 遊戲畫面"></canvas>
<div class="hud" id="hud"><div class="hud-side"><div class="eyebrow">SCORE</div><div class="score" id="score">0</div><div class="combo" id="combo">COMBO ×0</div></div><div class="hud-middle"><div class="flow-label" id="flowText">FLOW</div><div class="flow-track"><div class="flow-fill" id="flowFill"></div></div></div><div class="hud-side right"><div class="eyebrow">BEST</div><div class="best" id="best">0</div><div class="mode" id="mode">FREE RUN</div></div></div>
<div class="event" id="event"><strong id="eventTitle"></strong><span id="eventPoints"></span></div><div class="hint" id="hint">TAP TO REVERSE</div><div class="hud-buttons" id="hudButtons"><button class="mini" id="soundBtn" aria-label="切換音效">♪</button><button class="mini" id="pauseBtn" aria-label="暫停">Ⅱ</button></div>
<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),overlay=$('overlay'),panel=$('panel');
let W=0,H=0,DPR=1,last=0,elapsed=0,scrollY=0,score=0,best=0,combo=0,flow=0,flowLeft=0,passed=0,perfect=0,maxCombo=0,playing=false,paused=false,mode='free',rng=Math.random,ball=null,obstacles=[],particles=[],stars=[],eventUntil=0,ambient=0,slow=0,spawnCounter=0,obstacleId=0,muted=false,ctxAudio=null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+(b-a)*rng();
const BASE_SPEED=175, MAX_SPEED=275, SPEED_RAMP_SECONDS=115;
try{muted=localStorage.getItem('cc-muted')==='true'}catch{};
function key(){return 'cc-v3-best-free'}
function getBest(){try{return +(localStorage.getItem(key())||0)}catch{return 0}}
function setBest(){try{localStorage.setItem(key(),String(best))}catch{}}
function resize(){const oldW=W,oldH=H;W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);if(ball){ball.x=clamp(ball.x+(W-oldW)/2,ball.r+18,W-ball.r-18);ball.y=H*.25;for(const o of obstacles){o.x+=(W-oldW)/2;o.y+=(H-oldH)*.25}}stars=Array.from({length:Math.min(95,Math.floor(W*H/7000))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.25,par:Math.random()*.8+.2}))}
addEventListener('resize',resize);resize();
function audio(f=500,d=.08,type='sine',gain=.035){if(muted)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;ctxAudio??=new A();if(ctxAudio.state==='suspended')ctxAudio.resume();const o=ctxAudio.createOscillator(),g=ctxAudio.createGain();o.type=type;o.frequency.setValueAtTime(f,ctxAudio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(70,f*.65),ctxAudio.currentTime+d);g.gain.setValueAtTime(gain,ctxAudio.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctxAudio.currentTime+d);o.connect(g);g.connect(ctxAudio.destination);o.start();o.stop(ctxAudio.currentTime+d)}catch{}}
function emit(x,y,color,count=10,power=130){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=Math.random()*power+20,life=Math.random()*.3+.25;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life,max:life,color,r:Math.random()*2.5+1})}if(particles.length>190)particles.splice(0,particles.length-190)}
function notify(title,points='',time=.75){$('eventTitle').textContent=title;$('eventPoints').textContent=points;$('event').classList.add('show');eventUntil=elapsed+time}
function hud(){$('score').textContent=score.toLocaleString();$('best').textContent=best.toLocaleString();$('combo').textContent='COMBO ×'+combo;$('flowFill').style.width=(flowLeft>0?100:flow)+'%';$('flowText').textContent=flowLeft>0?'FLOW ×2':'FLOW';$('mode').textContent=elapsed>=SPEED_RAMP_SECONDS?'MAX SPEED':'SPEED '+Math.round(100*clamp(elapsed/SPEED_RAMP_SECONDS,0,1))+'%'}
function menu(){playing=false;paused=false;ball=null;obstacles=[];particles=[];score=0;combo=0;flow=0;flowLeft=0;best=getBest();hud();$('hudButtons').classList.add('hidden');$('hint').classList.add('hidden');$('event').classList.remove('show');panel.innerHTML=`<div class="tag">ONE TAP · ENDLESS ARCADE</div><div class="logo"></div><div class="kicker">擦 邊 球</div><h1>CLOSE CALL</h1><div class="description">點一下就能<strong>反轉移動方向</strong>。<br>與障礙物擦身而過，累積連擊，啟動 FLOW。</div><div class="stats"><div class="stat"><strong>+10</strong><span>安全通過</span></div><div class="stat"><strong>+100</strong><span>完美擦邊</span></div><div class="stat"><strong>×2</strong><span>FLOW 模式</span></div></div><button class="btn" id="start">開始挑戰 ↗</button><div class="settings"><button class="setting" id="menuSound">音效：${muted?'關':'開'}</button></div><div class="note">手機點擊 / 電腦空白鍵 · P 暫停<br>逐漸加速 · 最高速度有限制 · 無震動</div>`;overlay.classList.remove('hidden');$('start').onclick=()=>start();$('menuSound').onclick=()=>{toggleSound();$('menuSound').textContent='音效：'+(muted?'關':'開')}}
function toggleSound(){muted=!muted;$('soundBtn').textContent=muted?'♪̸':'♪';try{localStorage.setItem('cc-muted',String(muted))}catch{}}
function start(){mode='free';rng=Math.random;best=getBest();score=combo=flow=flowLeft=passed=perfect=maxCombo=elapsed=scrollY=spawnCounter=obstacleId=slow=0;ambient=0;obstacles=[];particles=[];ball={x:W*.5,y:H*.25,r:11,dir:1,trail:[]};playing=true;paused=false;overlay.classList.add('hidden');$('hudButtons').classList.remove('hidden');$('hint').classList.remove('hidden');$('pauseBtn').textContent='Ⅱ';$('soundBtn').textContent=muted?'♪̸':'♪';$('event').classList.remove('show');hud();last=performance.now();/* Spawn only below the player, approaching from below toward the top. */for(let i=0;i<5;i++)spawn(H*.53+i*175)}
function spawn(y){const level=clamp(passed/55,0,1),width=Math.max(200,W),r=rand(18,28+level*8);let kind='mine';if(passed>7){const n=rng();kind=n<.16+level*.13?'laser':n<.35+level*.19?'mover':'mine'}const o={id:obstacleId++,kind,x:rand(r+35,width-r-35),y,r,phase:rand(0,6.28),amp:rand(12,Math.min(38,W*.11)),freq:rand(1,2.2),length:rand(60,92),thick:rand(11,15),angle:rand(0,6.28),rot:rand(-1.2,1.2),closest:Infinity,passed:false,spin:rand(0,6.28)};o.x=clamp(o.x,35+r,W-35-r);if(kind==='laser')o.x=clamp(o.x,90,W-90);obstacles.push(o)}
function segmentDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,t=clamp(((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy),0,1);return Math.hypot(px-(x1+dx*t),py-(y1+dy*t))}
function clearance(o,x=ball.x,y=ball.y){if(o.kind==='laser'){const dx=Math.cos(o.angle)*o.length*.5,dy=Math.sin(o.angle)*o.length*.5;return segmentDist(x,y,o.x-dx,o.y-dy,o.x+dx,o.y+dy)-o.thick*.5-ball.r}return Math.hypot(x-o.x,y-o.y)-o.r-ball.r}
function reward(o){let bonus=0,label='';if(o.closest<9){bonus=100;label='PERFECT';perfect++}else if(o.closest<23){bonus=50;label='CLOSE CALL'}else if(o.closest<40){bonus=20;label='NEAR MISS'}if(bonus){combo++;maxCombo=Math.max(combo,maxCombo);if(flowLeft<=0)flow=clamp(flow+(bonus===100?24:bonus===50?14:8),0,100);if(flow>=100&&flowLeft<=0){flowLeft=8;flow=0;notify('FLOW ACTIVATED','SCORE ×2',1.1);audio(790,.23,'triangle',.05)}else notify(label,'+'+(bonus*(flowLeft>0?2:1)+Math.min(combo,20)*5),.7);emit(o.x,ball.y,bonus===100?'#ffe09a':'#7de7f9',bonus===100?22:12);audio(570+Math.min(combo,12)*32,.11,'triangle',.04)}else combo=0;score+=10+bonus*(flowLeft>0?2:1)+(bonus?Math.min(combo,20)*5:0);if(score>best){best=score;setBest()}hud()}
function over(){if(!playing)return;playing=false;paused=false;slow=.35;emit(ball.x,ball.y,'#ffe09a',40,170);audio(210,.24,'triangle',.07);$('hudButtons').classList.add('hidden');$('hint').classList.add('hidden');panel.innerHTML=`<div class="tag">RUN COMPLETE</div><h2>GAME OVER</h2><div class="eyebrow">FINAL SCORE</div><div class="result-score">${score.toLocaleString()}</div><div class="result-grid"><div><strong>${best.toLocaleString()}</strong><span>BEST</span></div><div><strong>${perfect}</strong><span>PERFECT</span></div><div><strong>×${maxCombo}</strong><span>MAX COMBO</span></div></div><button class="btn" id="again">再挑戰一次 ↗</button><button class="btn alt" id="share">分享成績</button><button class="btn alt" id="back">返回主選單</button>`;overlay.classList.remove('hidden');$('again').onclick=()=>start();$('share').onclick=share;$('back').onclick=menu}
function share(){const msg=`我在 CLOSE CALL 拿到 ${score} 分！你能超越嗎？\n${location.origin+location.pathname}`;if(navigator.share)navigator.share({text:msg}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(msg).then(()=>notify('COPIED','已複製')).catch(()=>prompt('複製成績',msg));else prompt('複製成績',msg)}
function tap(){if(!playing||paused)return;ball.dir*=-1;audio(390,.045,'sine',.024);emit(ball.x,ball.y,'#ffe09a',5,55)}
function pause(){if(!playing)return;paused=!paused;$('pauseBtn').textContent=paused?'▶':'Ⅱ';$('hint').textContent=paused?'PAUSED · TAP ▶ TO RESUME':'TAP TO REVERSE'}
function update(dt){ambient+=dt;if(!playing||paused)return;elapsed+=dt;const level=clamp(elapsed/SPEED_RAMP_SECONDS,0,1),speed=BASE_SPEED+(MAX_SPEED-BASE_SPEED)*level,side=Math.min(180,W*.41)+level*25;scrollY+=speed*dt;if(flowLeft>0)flowLeft=Math.max(0,flowLeft-dt);ball.x+=ball.dir*side*dt;ball.trail.push({x:ball.x,y:ball.y});if(ball.trail.length>18)ball.trail.shift();if(ball.x<ball.r+16||ball.x>W-ball.r-16){ball.x=clamp(ball.x,ball.r+16,W-ball.r-16);over();return}
for(const o of obstacles){/* World moves UP, obstacles approach the player from below. */o.y-=speed*dt;if(o.kind==='mover')o.x+=Math.cos(elapsed*o.freq+o.phase)*o.amp*dt*1.7;if(o.kind==='laser')o.angle+=o.rot*dt;o.spin+=dt;const d=clearance(o);if(Math.abs(o.y-ball.y)<105){o.closest=Math.min(o.closest,d);if(d<0){over();return}}if(!o.passed&&o.y<ball.y-Math.max(o.r,o.kind==='laser'?o.length*.5:0)-ball.r){o.passed=true;passed++;reward(o)}}obstacles=obstacles.filter(o=>o.y>-120);let bottom=obstacles.reduce((m,o)=>Math.max(m,o.y),H*.45);while(bottom<H+200){bottom+=rand(150+level*28,198+level*34);spawn(bottom)}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.max(0,1-1.4*dt);p.vy*=Math.max(0,1-1.4*dt);p.life-=dt}particles=particles.filter(p=>p.life>0);if(eventUntil<elapsed)$('event').classList.remove('show');hud()}
function background(){const g=ctx.createLinearGradient(0,0,0,H);const flowing=flowLeft>0;g.addColorStop(0,flowing?'#211b2b':'#101b31');g.addColorStop(.6,flowing?'#172638':'#0b1426');g.addColorStop(1,'#070d1a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const aura=ctx.createRadialGradient(W*.5,H*.32,10,W*.5,H*.5,H*.7);aura.addColorStop(0,flowing?'#dba85112':'#4277c012');aura.addColorStop(1,'#00000000');ctx.fillStyle=aura;ctx.fillRect(0,0,W,H);
for(const s of stars){const y=(s.y+(ambient*13+s.par*scrollY*.13))%H;ctx.fillStyle=`rgba(160,200,255,${.09+s.par*.28})`;ctx.fillRect(s.x,y,s.r,s.r*2)}
const vanish=H*.05,horizon=H*.13;ctx.strokeStyle=flowing?'#f6c66b24':'#76b4f624';ctx.lineWidth=1;for(let i=-6;i<=6;i++){ctx.beginPath();ctx.moveTo(W*.5+i*11,horizon);ctx.lineTo(W*.5+i*W*.25,H);ctx.stroke()}const phase=(scrollY*.55)%55;for(let i=0;i<16;i++){const t=((i*55+phase)%(H-horizon))/(H-horizon),y=horizon+t*(H-horizon);ctx.globalAlpha=.07+.20*t;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.globalAlpha=1;
for(const x of [20,W-20]){ctx.strokeStyle=flowing?'#fbd58180':'#75b5ed66';ctx.shadowColor=flowing?'#ffe09a':'#4aa9ff';ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}ctx.shadowBlur=0;for(let y=(scrollY*1.3)%72-72;y<H;y+=72){ctx.fillStyle=flowing?'#ffe09a90':'#78c6ff75';ctx.fillRect(17,y,6,23);ctx.fillRect(W-23,y,6,23)}ctx.globalAlpha=1}
function obstacleDraw(o){ctx.save();ctx.translate(o.x,o.y);const laser=o.kind==='laser',mover=o.kind==='mover',c=laser?'#ed85f8':mover?'#7de8ff':'#ff738e';ctx.shadowColor=c;ctx.shadowBlur=17;if(laser){ctx.rotate(o.angle);ctx.fillStyle='#31193d';round(-o.length/2-3,-o.thick/2-3,o.length+6,o.thick+6,7);ctx.fill();ctx.fillStyle=c;round(-o.length/2,-o.thick/2,o.length,o.thick,6);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffffffa9';round(-o.length/2+5,-2,o.length-10,4,2);ctx.fill();for(const x of [-o.length/2,o.length/2]){ctx.fillStyle='#26152f';ctx.beginPath();ctx.arc(x,0,9,0,7);ctx.fill();ctx.strokeStyle=c;ctx.lineWidth=2;ctx.stroke()}}else{ctx.fillStyle=mover?'#0b3448':'#471a34';ctx.beginPath();ctx.arc(0,0,o.r,0,7);ctx.fill();ctx.strokeStyle=c;ctx.lineWidth=3;ctx.stroke();ctx.shadowBlur=0;ctx.save();ctx.rotate(o.spin*(mover?-1:1));ctx.strokeStyle=c;ctx.lineWidth=3;for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.beginPath();ctx.moveTo(Math.cos(a)*(o.r*.58),Math.sin(a)*(o.r*.58));ctx.lineTo(Math.cos(a)*(o.r*.9),Math.sin(a)*(o.r*.9));ctx.stroke()}ctx.restore();ctx.fillStyle=c;ctx.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3;const rr=o.r*.52;const x=Math.cos(a)*rr,y=Math.sin(a)*rr;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath();ctx.fill();ctx.fillStyle='#ffffff9e';ctx.beginPath();ctx.arc(-o.r*.13,-o.r*.14,o.r*.14,0,7);ctx.fill();if(mover){ctx.strokeStyle='#7de8ff42';ctx.setLineDash([3,5]);ctx.beginPath();ctx.arc(0,0,o.r+8,0,7);ctx.stroke()}}ctx.restore()}
function round(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawBall(){if(!ball)return;ctx.strokeStyle='#ffe09a28';ctx.setLineDash([3,11]);ctx.beginPath();ctx.moveTo(24,ball.y);ctx.lineTo(W-24,ball.y);ctx.stroke();ctx.setLineDash([]);for(let i=0;i<ball.trail.length;i++){const p=ball.trail[i],t=i/ball.trail.length;ctx.fillStyle=`rgba(255,218,139,${t*.21})`;ctx.beginPath();ctx.arc(p.x,p.y,ball.r*(.35+t*.8),0,7);ctx.fill()}const pulse=Math.sin(ambient*5)*2;ctx.strokeStyle=flowLeft>0?'#b9f5ff7d':'#ffe09a57';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r+9+pulse,0,7);ctx.stroke();ctx.shadowColor=flowLeft>0?'#a8f7ff':'#ffd88a';ctx.shadowBlur=28;const g=ctx.createRadialGradient(ball.x-4,ball.y-5,1,ball.x,ball.y,ball.r+2);g.addColorStop(0,'#ffffff');g.addColorStop(.24,'#fff4ce');g.addColorStop(.75,flowLeft>0?'#95f5ff':'#f8cb77');g.addColorStop(1,flowLeft>0?'#3aa2cf':'#bc803f');ctx.fillStyle=g;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ffffff78';ctx.lineWidth=1;ctx.stroke()}
function draw(){ctx.clearRect(0,0,W,H);background();for(const o of obstacles)obstacleDraw(o);drawBall();for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1;if(flowLeft>0){ctx.fillStyle='#ffe09a09';ctx.fillRect(0,0,W,H)}if(paused){ctx.fillStyle='#07101dcc';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#f4f7ff';ctx.font='900 32px DM Sans, sans-serif';ctx.fillText('PAUSED',W/2,H*.5)}}
function frame(t){const dt=Math.min((t-last)/1000||0,.033);last=t;update(dt);draw();requestAnimationFrame(frame)}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();tap()});$('soundBtn').onclick=toggleSound;$('pauseBtn').onclick=pause;addEventListener('keydown',e=>{if(['Space','ArrowLeft','ArrowRight'].includes(e.code)){e.preventDefault();if(!e.repeat)tap()}else if(e.code==='KeyP')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing&&!paused)pause()});menu();requestAnimationFrame(frame);
})();
</script></body></html>
